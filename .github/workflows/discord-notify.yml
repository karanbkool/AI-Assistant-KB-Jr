name: Discord Notify

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: "Message to send to Discord"
        required: false
        default: "hi this is Karan Jr"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ASSISTANT }}
          MESSAGE: ${{ github.event.inputs.message || format('New push to {0} by {1}', github.ref_name, github.actor) }}
        run: |
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')"
